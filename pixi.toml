[workspace]
authors = ["Jacob Williams <jacobwilliams@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "halo"
# macOS 26 or later: KosmicKrisp (the Vulkan driver vkframes uses) needs Metal 4
platforms = [{ name = "osx-arm64-macos26", platform = "osx-arm64", macos = "26.0" }]
version = "0.1.0"

[tasks]
# the GUI (app/halo_gui.f90): qt-fortran + vkframes; see tools/fpm_gui.py
gui-build = "python tools/fpm_gui.py build"
gui = "python tools/fpm_gui.py run"
# the same, with the solver in quad precision (-DREAL128; much slower). vkframes stays in double precision.
gui-build-quad = { cmd = "python tools/fpm_gui.py build", env = { HALO_FPM_FLAGS = "-DREAL128" } }
gui-quad = { cmd = "python tools/fpm_gui.py run", env = { HALO_FPM_FLAGS = "-DREAL128" } }

[dependencies]
gfortran = ">=16.2.0,<16.3"
fpm = ">=0.13.0,<0.14"
python = ">=3.14.10,<3.15"
pyvista = ">=0.49.2,<0.50"
trame-pyvista = ">=0.3.6,<0.4"
nest-asyncio = ">=1.6.0,<2"
trame-vtk = ">=2.11.17,<3"
trame-vuetify = ">=3.3.0,<4"
trame = ">=4.0.0,<5"
nest-asyncio2 = ">=1.7.4,<2"
vulkanscenegraph = "1.1.*"
vsgxchange = "1.1.*"
vsgimgui = "0.8.*"
glslang = ">=16.6.0,<17"
cxx-compiler = ">=2.0.0,<3"
pkg-config = ">=0.29.2,<0.30"
mesa-kosmickrisp = ">=26.3.1,<27"
font-ttf-dejavu = ">=2.37,<3"
qt6-main = ">=6.11,<7"
matplotlib = ">=3.11.2,<4"
graphviz = ">=14.1.2,<15"
scipy = ">=1.18.1,<2"
spiceypy = ">=8.4.0,<9"
mumps-seq = ">=5.8.2,<6"

# the Vulkan loader uses KosmicKrisp only (Qt depends on MoltenVK, which is installed too)
[activation.env]
VK_DRIVER_FILES = "$CONDA_PREFIX/share/vulkan/icd.d/kosmickrisp_mesa_icd.aarch64.json"
